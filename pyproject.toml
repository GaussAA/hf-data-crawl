[project]
name = "hf-data-crawl"
version = "0.1.0"
description = "Hugging Face 数据集元信息底座：增量采集、对账、分层派生与 DuckDB 视图查询"
readme = "README.md"
authors = [
    { name = "GaussAA", email = "m17356051831@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "orjson>=3.10",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
    "zstandard>=0.24",
]

[project.scripts]
hf-data-crawl = "hf_data_crawl:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pre-commit>=4.0.0",
    "pyright==1.1.408",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8",
    "ruff>=0.17.3",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 保守规则集：pycodestyle 错误、pyflakes、isort、pyupgrade。
select = ["E", "F", "I", "UP"]
# 行宽交给 ruff format；它不折行的长注释和字符串，不当作 lint 错误。
ignore = ["E501"]

[tool.mypy]
# 类型检查的单一入口：`uv run mypy` 覆盖生产代码与测试代码，范围只在此定义。
# pre-commit 与 CI 都调用这条命令，不再各自手抄路径或使用另一套工具版本。
python_version = "3.13"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pyarrow 不发 `py.typed`、PyPI 也没有官方 stubs（2026-11-18 查证），而存储层要用它
# 做流式读写：百万行表整块进 `pl.DataFrame` 会把内存顶穿。与其在每处 import 上挂
# `type: ignore`，不如在这一处声明「这个包没有类型信息可用」。
#
# 但**这不代表 pyarrow 无人把关**：它其实带内联注解，只是缺 `py.typed` 标记，
# mypy 因此整包视作 Any，pyright 却能读到。所以涉及 pyarrow 的代码以 pyright 为准
# ——2026-11-18 正是漏了这一步，十个钩子全过、CI 的 pyright 报 16 处。
module = ["pyarrow.*"]
ignore_missing_imports = true


[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
