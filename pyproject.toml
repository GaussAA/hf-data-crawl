[project]
name = "hf-data-crawl"
version = "0.1.0"
description = "Hugging Face 数据集元信息底座：增量采集、对账、分层派生与 DuckDB 视图查询"
readme = "README.md"
authors = [
    { name = "GaussAA", email = "m17356051831@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "orjson>=3.10",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
    "zstandard>=0.24",
]

[project.scripts]
hf-data-crawl = "hf_data_crawl:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "mypy>=1.13,<2",
    "pre-commit>=4.0.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "ruff>=0.17.3",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 保守规则集：pycodestyle 错误、pyflakes、isort、pyupgrade。
select = ["E", "F", "I", "UP"]
# 行宽交给 ruff format；它不折行的长注释和字符串，不当作 lint 错误。
ignore = ["E501"]

[tool.mypy]
# 类型检查的单一入口：`uv run mypy` 覆盖生产代码与测试代码，范围只在此定义。
# pre-commit 与 CI 都调用这条命令，不再各自手抄路径或使用另一套工具版本。
python_version = "3.13"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pyarrow 不发 `py.typed`、PyPI 也没有官方 stubs（2026-11-18 查证），而存储层要用它
# 做流式读写：百万行表整块进 `pl.DataFrame` 会把内存顶穿。与其在每处 import 上挂
# `type: ignore`，不如在这一处声明「这个包没有类型信息可用」。
#
# 但**这不代表 pyarrow 无人把关**：它其实带内联注解，只是缺 `py.typed` 标记，
# mypy 因此整包视作 Any，basedpyright 却能读到。所以涉及 pyarrow 的代码以
# basedpyright 为准——2026-11-18 正是漏了这一步，十个钩子全过、CI 报 16 处。
module = ["pyarrow.*"]
ignore_missing_imports = true


[tool.basedpyright]
# 严格档。换掉 pyright、为什么只关 Unknown 家族、以及 pyarrow 的处置，见
# DECISIONS #142。
#
# 严格档会把「未知类型」沿调用链一路报下去：HF API 的 JSON 与 pyarrow 的运行时
# 属性没有静态形状，给它们编 TypedDict 只是给数据加壳。因此只关 Unknown 家族五条，
# 其余严格规则全开（含 reportPrivateUsage / reportUnusedImport / reportDeprecated
# 等 standard 档不查的规则）。
#
# pyarrow 有内联注解却缺 `py.typed`：用 allowedUntypedLibraries 放行这一个包，
# 而不是把 reportMissingTypeStubs 整条关掉——后者会连真正没类型信息的包一起放过。
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
allowedUntypedLibraries = ["pyarrow"]
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.coverage.run]
# 以包名计，与 CI 的 `--cov=hf_data_crawl` 同源；editable 安装下两者等价。
# 只覆盖 src，不把 tests 算进分母——测试覆盖测试自己会稀释真实数字。
source = ["hf_data_crawl"]
# 本项目大量判据是「走这条或那条」，只算行覆盖会漏掉没走到的分支。
# 首次打开会看到比行覆盖低不少的数字，那是真实值，不是回归。
branch = true

[tool.coverage.report]
# 缺失行号必须打出来：覆盖率的价值在「哪没测到」，不在那个百分比。
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
