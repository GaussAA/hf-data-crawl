[project]
name = "hf-data-crawl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GaussAA", email = "m17356051831@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
]

[project.scripts]
hf-data-crawl = "hf_data_crawl:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# 保守规则集：pycodestyle 错误、pyflakes、isort、pyupgrade。
select = ["E", "F", "I", "UP"]
# 行宽交给 ruff format；它不折行的长注释和字符串，不当作 lint 错误。
ignore = ["E501"]
