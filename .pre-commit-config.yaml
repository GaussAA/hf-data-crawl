# 核心工具（ruff / mypy / pytest / 文档校验）一律走 uv 锁定的本地环境，
# 版本与 uv.lock、GitHub Actions 完全一致；只有与项目依赖无关的文本检查
# 才用远端 hook，钩子版本不会悄悄漂移。
# 但本地与 CI 并非「完全同一动作」：ruff 钩子带 --fix 会改写文件，CI 只做只读检查。
# `ruff format` 现已覆盖 *.md（见下），`ruff check` 仍只认 *.py——ruff 不读 md 里的
# 代码块。要完全对齐，提交前跑一遍 `uv run ruff check .` 与 `uv run ruff format --check .`。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        # 也管 Markdown 里的 ```python 代码块：CI 跑的是 `ruff format --check .`，
        # 钩子若只管 *.py，文档示例就能静默飘出格式——2026-11-18 一次提交正是这样
        # 在 CI 上见红，而本地十个钩子全过（#125「同一把尺子」的第二个形态）。
        # `ruff check` 实测不读 md（对 GLOSSARY.md 报 "No Python files found"），
        # 所以只有这一项需要放宽范围。
        files: \.(py|md)$
      - id: mypy
        name: mypy (src + tests)
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
      # mypy 与 pyright 不是二选一，是两把不同的尺子。
      # 2026-11-18 的教训：pyarrow 26 有内联类型注解，却没有 `py.typed` 标记，
      # mypy 因此把整个包当 Any（`ignore_missing_imports` 更进一步把它静音），
      # pyright 却能读到那些注解。于是「十个钩子全过」的提交在 CI 的 pyright
      # 上见红 16 处——本地绿、远端红，最难查的一类偏差。
      # 钩子时间会多约 40 秒，比一次推送后再补一个修复提交便宜。
      - id: pyright
        name: pyright (src)
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: docs-links
        name: docs links
        entry: uv run python scripts/check_docs_links.py
        language: system
        pass_filenames: false
        files: ^(?:.*\.md|scripts/check_docs_links\.py)$
      # 本地并行提速；CI 仍串行跑全量——总得留一处「串行全量」，否则测试间的
      # 顺序依赖一旦出现，本地与 CI 会一起把它藏起来（全绿不等于都跑了）。
      #
      # 为什么是 8 而不是 `-n auto`：本机 16 逻辑核（4P+8E），实测串行 140s、
      # -n 4/6/8 落在 34~54s 且互相差在噪声内（瓶颈是磁盘 IO 不是 CPU），
      # -n 12 反而回到 56s。核少的机器可自行调小，别照抄。
      - id: pytest-fast
        name: pytest (full suite, -n 8)
        entry: uv run pytest -x --tb=short -n 8
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
