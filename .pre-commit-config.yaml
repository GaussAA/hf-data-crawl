# 核心工具（ruff / mypy / pytest / 文档校验）一律走 uv 锁定的本地环境，
# 版本与 uv.lock、GitHub Actions 完全一致；只有与项目依赖无关的文本检查
# 才用远端 hook。这样「本地能过、CI 却挂」或「钩子版本悄悄漂移」无从发生。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (src + tests)
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: docs-links
        name: docs links
        entry: uv run python scripts/check_docs_links.py
        language: system
        pass_filenames: false
        files: ^(?:.*\.md|scripts/check_docs_links\.py)$
      - id: pytest-fast
        name: pytest (full suite)
        entry: uv run pytest -x --tb=short
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
