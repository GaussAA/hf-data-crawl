name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # `--locked` 而不是裸 sync：pyproject 改了而 uv.lock 没重生成时，裸 sync 会
        # 就地重写 lock 并继续绿，「版本由 uv.lock 锁定」这条承诺当场失效。
        run: uv sync --locked

      - name: Run tests
        # 覆盖率是观测指标，不是闸门：不加 `--cov-fail-under`，CI 不会因覆盖率低而红。
        # 也不进 pre-commit（每次提交多跑一遍全量 + 统计，代价不值）。
        # 为什么这样定，见 CODING_STANDARDS.md「覆盖率的口径」。
        run: uv run pytest --tb=short -v --cov=hf_data_crawl --cov-report=term-missing

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

  types:
    name: Type check (pyright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      # mypy 覆盖 src + tests，pyright 补 src 的交叉检查。版本由 uv.lock 钉住；
      # 钉了却不跑等于没有，且下次升级时没人知道它会不会红。
      - name: Run pyright
        run: uv run pyright

  docs:
    name: Check documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        # 与 test / lint 同一个解释器：用 runner 自带的 python3（3.12）跑校验器，
        # 等于在测一个本项目并不支持的版本，本地能过而 CI 挂（或反之）时更难查。
        run: uv sync --locked

      - name: Check markdown files
        run: |
          # 检查文档结构
          test -f README.md
          test -f GLOSSARY.md
          test -f docs/README.md
          test -f docs/operations/RECOVERY.md
          test -f docs/operations/MONITORING.md

      - name: Check for broken links
        run: uv run python scripts/tools/check_docs_links.py
